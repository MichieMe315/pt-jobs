{% extends "base.html" %}
{% block title %}Job alerts · PT Jobs{% endblock %}
{% block content %}
<div class="card mx-auto p-4" style="max-width:720px">
<h1 class="h4">Get new jobs by email</h1>
<p>Choose your keywords and location. Each email includes an unsubscribe link.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Create alert</button></form>
</div>
{% endblock %}
