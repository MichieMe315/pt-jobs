{% extends 'career_mobility/standalone.html' %}{% block tool_content %}<h1>Sign in to your international plan</h1><form method="post" class="panel">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<input type="hidden" name="next" value="{{ next }}"><button>Sign in</button></form><p><a href="{% url 'mobility_international_password_reset' %}">Forgot your password?</a></p><p><a href="{% url 'mobility_international_signup' %}?next={{ next|urlencode }}">Create an international account</a></p>{% endblock %}
