{% extends "admin/change_list.html" %}
{% block search %}
{{ block.super }}
<section style="margin:12px 0;padding:12px 16px;border:1px solid var(--hairline-color);border-radius:8px">
  <h2>Columns</h2>
  <form action="{{ column_save_url }}" method="post" style="margin-top:12px">
    {% csrf_token %}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px">
      {% for name, label, selected in column_options %}{% if name != 'id' %}<label><input type="checkbox" name="columns" value="{{ name }}"{% if selected %} checked{% endif %}> {{ label }}</label>{% endif %}{% endfor %}
    </div>
    <p><button type="submit" class="button">Apply columns</button> <button type="submit" name="reset" value="1" class="button">Reset defaults</button></p>
  </form>
</section>
{% endblock %}
