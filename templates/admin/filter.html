<label class="pt-filter-select" hidden>
  <span>{{ title|capfirst }}</span>
  <select data-admin-filter>
    {% for choice in choices %}<option value="{{ choice.query_string }}"{% if choice.selected %} selected{% endif %}>{{ choice.display }}</option>{% endfor %}
  </select>
</label>
<noscript><div class="pt-filter-links"><strong>{{ title|capfirst }}</strong>{% for choice in choices %} <a href="{{ choice.query_string }}"{% if choice.selected %} aria-current="true"{% endif %}>{{ choice.display }}</a>{% endfor %}</div></noscript>
