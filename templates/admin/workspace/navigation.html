{% load static %}
<aside class="pt-sidebar" aria-label="Administration navigation">
<a class="admin-brand" href="{% url 'admin:index' %}"><span class="brand-badge">PT</span><span>Physiotherapy Jobs Canada<small>Admin</small></span></a>
<button type="button" class="pt-mobile-nav-button" hidden aria-expanded="false" aria-controls="admin-navigation">Menu</button>
<div class="pt-sidebar-visible">
<nav id="admin-navigation">
{% for section in sections %}
{% if section.children %}
<div class="nav-section"><div class="nav-parent{% if section.current %} current{% endif %}">{{ section.label }}</div>
{% for item in section.children %}<a class="nav-child{% if item.current %} current{% endif %}" href="{{ item.url }}"{% if item.current %} aria-current="page"{% endif %}>{{ item.label }}</a>{% endfor %}
</div>
{% else %}
<a class="nav-parent{% if section.current %} current{% endif %}" href="{{ section.url }}"{% if section.current %} aria-current="page"{% endif %}>{{ section.label }}</a>
{% endif %}
{% endfor %}
</nav></div>
<div class="sidebar-foot"><a href="{% url 'home' %}" target="_blank" rel="noopener">View website ↗</a><form method="post" action="{% url 'admin:logout' %}">{% csrf_token %}<button type="submit">Sign out</button></form></div>
</aside>
